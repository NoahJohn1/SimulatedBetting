name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a branch's verify job be proven by hand before a PR exists.
  workflow_dispatch:

# Work lands in bursts of pushes; without this, superseded runs finish for nothing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # The default is six hours. A Postgres service container that never reports healthy
    # otherwise hangs that long.
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: simbet
          POSTGRES_PASSWORD: simbet
          POSTGRES_DB: simbet_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U simbet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://simbet:simbet@localhost:5433/simbet_test
      TEST_DATABASE_URL: postgres://simbet:simbet@localhost:5433/simbet_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsx src/db/migrate.ts

      - run: npm run verify

      # Deliberately here rather than in the `verify` script: verify is what a developer runs
      # in a loop, and a 10-second build on every local run is a tax for no local benefit.
      # DATABASE_URL is already exported above; src/db/client.ts throws at import without it,
      # but nothing connects during a build.
      - run: npm run build
