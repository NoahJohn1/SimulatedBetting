name: Sportsbook cron jobs

# Vercel Hobby only allows crons that run once a day or less, so sync-odds (every 15
# minutes) and settle (every 10 minutes) run from here instead, hitting the same route
# handlers over HTTP with the same bearer-token auth Vercel Cron would have used. allowance
# and reconcile stay as native Vercel crons in vercel.json since both are daily-or-less.
# The schedule is disabled until APP_URL and CRON_SECRET exist as Actions repository secrets.
# Without them curl is handed a bare path and exits 3 before sending anything, which is what
# every scheduled run did between 2026-08-22 and 2026-08-24. Uncomment the three lines below
# to re-enable; see docs/repo-health.md section 1.5.
on:
  # schedule:
  #   - cron: '*/15 * * * *'
  #   - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  sync-odds:
    if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/sync-odds
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sf -X GET "$APP_URL/api/cron/sync-odds" \
            -H "Authorization: Bearer $CRON_SECRET"

  settle:
    if: github.event.schedule == '*/10 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/settle
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sf -X GET "$APP_URL/api/cron/settle" \
            -H "Authorization: Bearer $CRON_SECRET"
